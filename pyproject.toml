[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-negotiation-framework"
version = "0.1.0"
description = "A testable multi-agent negotiation protocol with AscendC execution adapters"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
real = ["openai>=1.30", "paramiko>=3.4", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["negotiation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
